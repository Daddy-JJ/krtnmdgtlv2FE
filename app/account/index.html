<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Account - KartuNamaDigital.id</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="/assets/css/app.css"></head><body class="dashboard-shell app-shell-page min-h-screen text-white"><a class="skip-link" href="#main">Lewati ke konten</a><header class="border-b border-slate-200 bg-white"><nav class="mx-auto flex min-h-16 max-w-4xl items-center justify-between px-4" aria-label="Navigasi aplikasi"><a href="/app/" class="font-bold">KartuNamaDigital.id</a><button class="min-h-11 rounded-lg border border-slate-300 bg-white px-4 py-2.5 text-sm font-semibold" type="button" data-account-logout>Keluar</button></nav></header><main id="main" class="mx-auto max-w-4xl px-4 py-8"><p class="text-sm font-semibold uppercase tracking-wider text-teal-700">Account</p><h1 class="mt-1 text-3xl font-black tracking-tight">Pengaturan akun</h1><p class="mt-2 text-slate-600" aria-live="polite" data-form-status>Kelola verifikasi email dan keamanan akun.</p><div class="mt-6 grid gap-6 md:grid-cols-2"><section class="rounded-lg border border-slate-200 bg-white p-5"><h2 class="text-xl font-black">Verifikasi email</h2><form class="mt-5 space-y-4" data-account-verify-form novalidate><div><label class="block text-sm font-semibold" for="verify-email">Email</label><input class="mt-2 w-full rounded-lg border border-slate-300 px-3 py-3" id="verify-email" name="email" type="email" autocomplete="email" required><p class="mt-1 text-sm text-red-700" data-field-error="email"></p></div><div><label class="block text-sm font-semibold" for="verify-code">Kode OTP</label><input class="mt-2 w-full rounded-lg border border-slate-300 px-3 py-3 text-center text-2xl font-bold tracking-widest" id="verify-code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" required><p class="mt-1 text-sm text-red-700" data-field-error="code"></p></div><button class="min-h-11 w-full rounded-lg bg-teal-700 px-4 py-3 font-bold text-white" type="submit">Verifikasi email</button><button class="min-h-11 w-full rounded-lg border border-slate-300 bg-white px-4 py-3 font-bold" type="button" data-account-resend>Kirim ulang OTP</button></form></section><section class="rounded-lg border border-slate-200 bg-white p-5"><h2 class="text-xl font-black">Reset password</h2><form class="mt-5 space-y-4" data-account-reset-form novalidate><div><label class="block text-sm font-semibold" for="reset-email">Email</label><input class="mt-2 w-full rounded-lg border border-slate-300 px-3 py-3" id="reset-email" name="email" type="email" autocomplete="email" required><p class="mt-1 text-sm text-red-700" data-field-error="email"></p></div><button class="min-h-11 w-full rounded-lg bg-slate-900 px-4 py-3 font-bold text-white" type="submit">Kirim instruksi reset</button></form><p class="mt-4 text-sm text-slate-600">OTP dan reset token tidak pernah ditampilkan di halaman ini. Email status detail menunggu endpoint account profile backend aktif.</p></section></div></main><script type="module" src="/components/app-shell.js"></script><script type="module" src="/pages/app/account.js"></script></body></html>
