<article class="digital-card theme-pro-vertical-black-gold" data-theme-code="pro-vertical-black-gold" data-orientation="portrait">
  <span class="digital-card__ornament digital-card__ornament--stack" aria-hidden="true"></span>
  <div class="digital-card__content">
    <section class="digital-card__identity">
      <div class="digital-card__logo-slot" data-logo-slot hidden>
        <img class="digital-card__logo" data-field="logoUrl" alt="Logo perusahaan" hidden>
      </div>
      <div class="digital-card__heading">
        <h1 class="digital-card__name" data-field="fullName"></h1>
        <p class="digital-card__role" data-field="jobTitle"></p>
      </div>
      <p class="digital-card__org digital-card__org--badge" data-field="organization"></p>
      <a class="digital-card__portrait-address" data-field="addressText" target="_blank" rel="noopener noreferrer"></a>
      <ul class="digital-card__portrait-contact-data digital-card__sr-only" aria-label="Informasi kontak lengkap">
        <li data-contact-row><a data-field="officePhone"></a></li>
        <li data-contact-row><a data-field="mobilePhone"></a></li>
        <li data-contact-row><a data-field="email"></a></li>
        <li data-contact-row><a data-field="websiteUrl" target="_blank" rel="noopener noreferrer"></a></li>
      </ul>
      <nav class="digital-card__socials digital-card__sr-only" data-list="socialLinks" aria-label="Media sosial"></nav>
    </section>
    <aside class="digital-card__aside">
      <img class="digital-card__qr" data-field="qrUrl" alt="QR code menuju kartu nama digital" hidden>
    </aside>
  </div>
</article>
