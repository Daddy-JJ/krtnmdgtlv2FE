<article class="digital-card theme-basic-soft-geometry" data-theme-code="basic-soft-geometry" data-orientation="landscape">
  <span class="digital-card__ornament digital-card__ornament--dots" aria-hidden="true"></span>
  <div class="digital-card__content">
    <section class="digital-card__identity">
      <div class="digital-card__heading">
        <h1 class="digital-card__name" data-field="fullName"></h1>
        <p class="digital-card__role" data-field="jobTitle"></p>
        <p class="digital-card__org" data-field="organization"></p>
      </div>
      <ul class="digital-card__contacts digital-card__contacts--labelled" aria-label="Informasi kontak">
        <li class="digital-card__contact" data-contact-row><span aria-hidden="true">☎</span><strong>Office</strong><a data-field="officePhone"></a></li>
        <li class="digital-card__contact" data-contact-row><span aria-hidden="true">▣</span><strong>Mobile</strong><a data-field="mobilePhone"></a></li>
        <li class="digital-card__contact" data-contact-row><span aria-hidden="true">✉</span><strong>Email</strong><a data-field="email"></a></li>
        <li class="digital-card__contact" data-contact-row><span aria-hidden="true">◎</span><strong>Website</strong><a data-field="websiteUrl" target="_blank" rel="noopener noreferrer"></a></li>
        <li class="digital-card__contact" data-contact-row><span aria-hidden="true">⌖</span><strong>Address</strong><a data-field="addressText" target="_blank" rel="noopener noreferrer"></a></li>
      </ul>
      <nav class="digital-card__socials" data-list="socialLinks" aria-label="Media sosial"></nav>
    </section>
    <aside class="digital-card__aside digital-card__aside--framed">
      <p class="digital-card__qr-label">Scan to connect</p>
      <img class="digital-card__qr" data-field="qrUrl" alt="QR code menuju kartu nama digital" hidden>
    </aside>
  </div>
</article>
