<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verifikasi Email - KartuNamaDigital.id</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="/assets/css/app.css"></head><body class="min-h-screen bg-slate-50 text-slate-900"><a class="skip-link" href="#main">Lewati ke konten</a><header class="border-b border-slate-200 bg-white"><nav class="mx-auto flex min-h-16 max-w-3xl items-center justify-between px-4" aria-label="Navigasi utama"><a href="/" class="font-bold">KartuNamaDigital.id</a><a href="/login/" class="text-sm font-semibold">Masuk</a></nav></header><main id="main" class="mx-auto max-w-md px-4 py-10"><h1 class="text-3xl font-black tracking-tight">Verifikasi email</h1><p class="mt-3 text-slate-600">Masukkan kode 6 digit dari email Anda.</p><form class="mt-8 space-y-5" data-verify-form novalidate><div><label class="block text-sm font-semibold" for="email">Email</label><input class="mt-2 w-full rounded-lg border border-slate-300 px-3 py-3" id="email" name="email" type="email" autocomplete="email" required><p class="mt-1 text-sm text-red-700" data-field-error="email"></p></div><div><label class="block text-sm font-semibold" for="code">Kode OTP</label><input class="mt-2 w-full rounded-lg border border-slate-300 px-3 py-3 text-center text-2xl font-bold tracking-widest" id="code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" required><p class="mt-1 text-sm text-red-700" data-field-error="code"></p></div><button class="min-h-11 w-full rounded-lg bg-teal-700 px-4 py-3 font-bold text-white" type="submit">Verifikasi</button><button class="min-h-11 w-full rounded-lg border border-slate-300 bg-white px-4 py-3 font-semibold" type="button" data-resend-otp>Kirim ulang OTP</button><p class="text-sm" aria-live="polite" data-form-status></p></form></main><script type="module" src="/pages/auth/verify-email.js"></script></body></html>
