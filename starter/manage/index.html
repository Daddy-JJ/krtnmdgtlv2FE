<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex, follow"><meta name="theme-color" content="#070a18"><link rel="icon" href="/assets/favicon.svg" type="image/svg+xml"><title>Kelola Starter - KartuNamaDigital.id</title><link rel="stylesheet" href="/assets/css/tailwind.css"><link rel="stylesheet" href="/assets/css/app.css"></head><body class="auth-shell min-h-screen text-white"><a class="skip-link" href="#main">Lewati ke konten</a><header class="auth-header border-b border-white/10"><nav class="mx-auto flex min-h-16 max-w-4xl items-center justify-between px-4" aria-label="Navigasi utama"><a href="/" class="font-bold">KartuNamaDigital.id</a><a href="/login/" class="text-sm font-semibold">Masuk untuk claim</a></nav></header><main id="main" class="auth-main auth-main--wide"><h1 class="text-3xl font-black tracking-tight">Kelola kartu Starter</h1><p class="auth-intro mt-3 max-w-2xl ">Update dan claim memakai cookie manage dari server. Token manage tidak ditampilkan atau disimpan di JavaScript.</p><form class="auth-panel mt-8 grid gap-5 md:grid-cols-2" data-starter-manage-form novalidate><div class="md:col-span-2"><label class="block text-sm font-semibold" for="publicId">Public ID</label><input class="mt-2 w-full rounded-lg border border-slate-300 px-3 py-3" id="publicId" name="publicId" autocomplete="off" required><p class="mt-1 text-sm text-red-700" data-field-error="publicId"></p></div><div><label class="block text-sm font-semibold" for="fullName">Nama</label><input class="mt-2 w-full rounded-lg border border-slate-300 px-3 py-3" id="fullName" name="fullName" required><p class="mt-1 text-sm text-red-700" data-field-error="fullName"></p></div><div><label class="block text-sm font-semibold" for="jobTitle">Jabatan</label><input class="mt-2 w-full rounded-lg border border-slate-300 px-3 py-3" id="jobTitle" name="jobTitle"><p class="mt-1 text-sm text-red-700" data-field-error="jobTitle"></p></div><div><label class="block text-sm font-semibold" for="organization">Perusahaan</label><input class="mt-2 w-full rounded-lg border border-slate-300 px-3 py-3" id="organization" name="organization"><p class="mt-1 text-sm text-red-700" data-field-error="organization"></p></div><div><label class="block text-sm font-semibold" for="officePhone">Telepon kantor</label><input class="mt-2 w-full rounded-lg border border-slate-300 px-3 py-3" id="officePhone" name="officePhone" inputmode="tel"><p class="mt-1 text-sm text-red-700" data-field-error="officePhone"></p></div><div><label class="block text-sm font-semibold" for="mobilePhone">Nomor mobile</label><input class="mt-2 w-full rounded-lg border border-slate-300 px-3 py-3" id="mobilePhone" name="mobilePhone" inputmode="tel"><p class="mt-1 text-sm text-red-700" data-field-error="mobilePhone"></p></div><div><label class="block text-sm font-semibold" for="email">Email</label><input class="mt-2 w-full rounded-lg border border-slate-300 px-3 py-3" id="email" name="email" type="email" required><p class="mt-1 text-sm text-red-700" data-field-error="email"></p></div><div class="md:col-span-2"><label class="block text-sm font-semibold" for="websiteUrl">Website</label><input class="mt-2 w-full rounded-lg border border-slate-300 px-3 py-3" id="websiteUrl" name="websiteUrl" type="url" placeholder="https://example.com" required><p class="mt-1 text-sm text-red-700" data-field-error="websiteUrl"></p></div><div class="md:col-span-2"><label class="block text-sm font-semibold" for="addressText">Alamat</label><textarea class="mt-2 min-h-28 w-full rounded-lg border border-slate-300 px-3 py-3" id="addressText" name="addressText"></textarea><p class="mt-1 text-sm text-red-700" data-field-error="addressText"></p></div><div class="flex flex-col gap-3 md:col-span-2 sm:flex-row"><button class="auth-primary min-h-11 flex-1 rounded-lg px-4 py-3 font-bold text-white" type="submit">Simpan perubahan</button><button class="auth-secondary min-h-11 flex-1 rounded-lg border px-4 py-3 font-bold" type="button" data-starter-claim>Claim ke akun login</button></div><p class="md:col-span-2 text-sm" aria-live="polite" data-form-status></p></form></main><script type="module" src="/pages/starter/manage.js"></script></body></html>
