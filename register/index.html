<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex, follow"><meta name="theme-color" content="#070a18"><link rel="icon" href="/assets/favicon.svg" type="image/svg+xml"><title>Daftar - KartuNamaDigital.id</title><link rel="stylesheet" href="/assets/css/tailwind.css"><link rel="stylesheet" href="/assets/css/app.css"></head><body class="auth-shell min-h-screen text-white"><a class="skip-link" href="#main">Lewati ke konten</a><header class="auth-header border-b border-white/10"><nav class="mx-auto flex min-h-16 max-w-3xl items-center justify-between px-4" aria-label="Navigasi utama"><a href="/" class="font-bold">KartuNamaDigital.id</a><a href="/login/" class="rounded-lg bg-slate-900 px-4 py-2.5 text-sm font-semibold text-white">Masuk</a></nav></header><main id="main" class="auth-main"><h1 class="text-3xl font-black tracking-tight">Daftar akun</h1><p class="auth-intro mt-3 ">Gunakan email aktif untuk menerima OTP verifikasi.</p><form class="auth-panel mt-8 space-y-5" data-register-form novalidate><div><label class="block text-sm font-semibold" for="email">Email</label><input class="mt-2 w-full rounded-lg border border-slate-300 px-3 py-3" id="email" name="email" type="email" autocomplete="email" required><p class="mt-1 text-sm text-red-700" data-field-error="email" id="email-error"></p></div><div><label class="block text-sm font-semibold" for="password">Password</label><input class="mt-2 w-full rounded-lg border border-slate-300 px-3 py-3" id="password" name="password" type="password" autocomplete="new-password" minlength="8" required><p class="mt-1 text-sm text-red-700" data-field-error="password" id="password-error"></p></div><button class="auth-primary min-h-11 w-full rounded-lg px-4 py-3 font-bold text-white" type="submit">Daftar dan kirim OTP</button><p class="text-sm" aria-live="polite" data-form-status></p></form></main><script type="module" src="/pages/
