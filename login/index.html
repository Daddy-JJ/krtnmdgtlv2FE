<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Masuk - KartuNamaDigital.id</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="/assets/css/app.css"></head><body class="min-h-screen bg-slate-50 text-slate-900"><a class="skip-link" href="#main">Lewati ke konten</a><header class="border-b border-slate-200 bg-white"><nav class="mx-auto flex min-h-16 max-w-3xl items-center justify-between px-4" aria-label="Navigasi utama"><a href="/" class="font-bold">KartuNamaDigital.id</a><a href="/register/" class="rounded-lg border border-slate-300 bg-white px-4 py-2.5 text-sm font-semibold">Daftar</a></nav></header><main id="main" class="mx-auto max-w-md px-4 py-10"><h1 class="text-3xl font-black tracking-tight">Masuk</h1><form class="mt-8 space-y-5" data-login-form novalidate><div><label class="block text-sm font-semibold" for="email">Email</label><input class="mt-2 w-full rounded-lg border border-slate-300 px-3 py-3" id="email" name="email" type="email" autocomplete="email" required><p class="mt-1 text-sm text-red-700" data-field-error="email"></p></div><div><label class="block text-sm font-semibold" for="password">Password</label><input class="mt-2 w-full rounded-lg border border-slate-300 px-3 py-3" id="password" name="password" type="password" autocomplete="current-password" required><p class="mt-1 text-sm text-red-700" data-field-error="password"></p></div><button class="min-h-11 w-full rounded-lg bg-slate-900 px-4 py-3 font-bold text-white" type="submit">Masuk</button><p class="text-sm" aria-live="polite" data-form-status></p><p class="text-sm"><a class="font-semibold text-teal-700" href="/forgot-password/">Lupa password?</a></p></form></main><script type="module" src="/pages/auth/login.js"></script></body></html>
