<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Buat Starter - KartuNamaDigital.id</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="/assets/css/app.css"></head><body class="min-h-screen bg-slate-50 text-slate-900"><a class="skip-link" href="#main">Lewati ke konten</a><header class="border-b border-slate-200 bg-white"><nav class="mx-auto flex min-h-16 max-w-4xl items-center justify-between px-4" aria-label="Navigasi utama"><a href="/" class="font-bold">KartuNamaDigital.id</a><a href="/login/" class="text-sm font-semibold">Masuk</a></nav></header><main id="main" class="mx-auto max-w-4xl px-4 py-10"><h1 class="text-3xl font-black tracking-tight">Buat kartu Starter</h1><p class="mt-3 max-w-2xl text-slate-600">Starter dibuat tanpa akun. Link manage disiapkan oleh cookie aman dari server, sedangkan URL publik tetap random dan read-only.</p><form class="mt-8 grid gap-5 md:grid-cols-2" data-starter-create-form novalidate><div><label class="block text-sm font-semibold" for="fullName">Nama</label><input class="mt-2 w-full rounded-lg border border-slate-300 px-3 py-3" id="fullName" name="fullName" required><p class="mt-1 text-sm text-red-700" data-field-error="fullName"></p></div><div><label class="block text-sm font-semibold" for="jobTitle">Jabatan</label><input class="mt-2 w-full rounded-lg border border-slate-300 px-3 py-3" id="jobTitle" name="jobTitle"><p class="mt-1 text-sm text-red-700" data-field-error="jobTitle"></p></div><div><label class="block text-sm font-semibold" for="organization">Perusahaan</label><input class="mt-2 w-full rounded-lg border border-slate-300 px-3 py-3" id="organization" name="organization"><p class="mt-1 text-sm text-red-700" data-field-error="organization"></p></div><div><label class="block text-sm font-semibold" for="officePhone">Telepon kantor</label><input class="mt-2 w-full rounded-lg border border-slate-300 px-3 py-3" id="officePhone" name="officePhone" inputmode="tel"><p class="mt-1 text-sm text-red-700" data-field-error="officePhone"></p></div><div><label class="block text-sm font-semibold" for="mobilePhone">Nomor mobile</label><input class="mt-2 w-full rounded-lg border border-slate-300 px-3 py-3" id="mobilePhone" name="mobilePhone" inputmode="tel"><p class="mt-1 text-sm text-red-700" data-field-error="mobilePhone"></p></div><div><label class="block text-sm font-semibold" for="email">Email</label><input class="mt-2 w-full rounded-lg border border-slate-300 px-3 py-3" id="email" name="email" type="email" required><p class="mt-1 text-sm text-red-700" data-field-error="email"></p></div><div class="md:col-span-2"><label class="block text-sm font-semibold" for="websiteUrl">Website</label><input class="mt-2 w-full rounded-lg border border-slate-300 px-3 py-3" id="websiteUrl" name="websiteUrl" type="url" placeholder="https://example.com" required><p class="mt-1 text-sm text-red-700" data-field-error="websiteUrl"></p></div><div class="md:col-span-2"><label class="block text-sm font-semibold" for="addressText">Alamat</label><textarea class="mt-2 min-h-28 w-full rounded-lg border border-slate-300 px-3 py-3" id="addressText" name="addressText"></textarea><p class="mt-1 text-sm text-red-700" data-field-error="addressText"></p></div><div class="md:col-span-2"><button class="min-h-11 w-full rounded-lg bg-teal-700 px-4 py-3 font-bold text-white" type="submit">Buat kartu Starter</button><p class="mt-3 text-sm" aria-live="polite" data-form-status></p></div></form><section class="mt-8 rounded-lg border border-teal-200 bg-teal-50 p-4" data-starter-result hidden><h2 class="font-bold">Kartu berhasil dibuat</h2><p class="mt-2 text-sm">URL publik Starter:</p><a class="mt-1 block break-all font-semibold text-teal-800" href="#" data-starter-url></a><a class="mt-4 inline-flex min-h-11 items-center rounded-lg bg-slate-900 px-4 py-3 font-bold text-white" href="/starter/manage/" data-starter-manage-link>Kelola kartu Starter</a></section></main><script type="module" src="/pages/starter/create.js"></script></body></html>
